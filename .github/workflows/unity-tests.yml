# Level 2: Unity EditMode tests (data validation, core systems).
# Only runs when Unity files change, on PRs to main, pushes to main, or by hand.
name: Unity tests

on:
  pull_request:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/unity-tests.yml"
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/unity-tests.yml"
  workflow_dispatch:
    inputs:
      testMode:
        description: "Tests to run (playmode costs more minutes)"
        type: choice
        default: editmode
        options: [editmode, playmode, all]

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
    steps:
      - name: Unity license present?
        if: env.HAS_LICENSE != 'true'
        run: |
          echo "::warning::UNITY_LICENSE secret is not set, Unity tests skipped. See docs/CI.md."

      - uses: actions/checkout@v4
        if: env.HAS_LICENSE == 'true'
        with:
          lfs: false

      # LFS cache: only download LFS files that changed since the last run
      - name: List LFS files
        if: env.HAS_LICENSE == 'true'
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        if: env.HAS_LICENSE == 'true'
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-

      - name: Pull LFS files
        if: env.HAS_LICENSE == 'true'
        run: git lfs pull

      # Library cache: the biggest time saver (avoids a full reimport)
      - name: Restore Library cache
        if: env.HAS_LICENSE == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: library-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('Assets/**') }}
          restore-keys: |
            library-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            library-

      - name: Run tests
        if: env.HAS_LICENSE == 'true'
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: ${{ inputs.testMode || 'editmode' }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity test results

      - name: Upload test results
        if: always() && env.HAS_LICENSE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          retention-days: 3
          if-no-files-found: ignore
